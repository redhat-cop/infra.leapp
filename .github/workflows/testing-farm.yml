---
name: Testing Farm — On-demand tests
on:
  # Tests that run on issue_comment are run from the PR branch.
  # Changes to the workflow file itself need to be merged to main first to
  # appear in CI runs, but tmt plans and tests run from the PR branch.
  issue_comment:
    types:
      - created
permissions:
  contents: read
  # This is required for the ability to create/update the Pull request status
  statuses: write
  # Required to react to the /citest comment
  pull-requests: write
jobs:
  parse_command:
    name: Parse /citest command
    # Only run on PR comments starting with /citest from authorized users
    if: |
      github.event.issue.pull_request
      && startsWith(github.event.comment.body, '/citest')
      && (contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      || github.event.comment.user.login == 'systemroller')
    runs-on: ubuntu-latest
    outputs:
      test_scope: ${{ steps.parse.outputs.test_scope }}
      upgrade_type: ${{ steps.parse.outputs.upgrade_type }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Parse comment
        id: parse
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          command=$(echo "$COMMENT_BODY" | head -n1 | tr -d '\r')

          # Parse: /citest <scope> [subtype]
          # Examples:
          #   /citest integration         — run all upgrade types
          #   /citest integration custom  — run only custom upgrade type
          command_name=$(echo "$command" | awk '{print $1}')
          scope=$(echo "$command" | awk '{print $2}')
          subtype=$(echo "$command" | awk '{print $3}')

          if [ "$command_name" != "/citest" ]; then
            echo "Unsupported command: $command_name"
            exit 1
          fi

          # Supported scopes: integration, remediation, role
          # Empty scope means run all test scopes
          if [ -z "$scope" ]; then
            scope="all"
          elif [ "$scope" != "integration" ] && [ "$scope" != "remediation" ] && [ "$scope" != "role" ]; then
            echo "Unsupported test scope: $scope"
            exit 1
          fi

          echo "test_scope=$scope" >> $GITHUB_OUTPUT
          echo "upgrade_type=$subtype" >> $GITHUB_OUTPUT

      - name: Checkout repo
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build matrix from test-matrix.json
        id: matrix
        env:
          SCOPE: ${{ steps.parse.outputs.test_scope }}
          UPGRADE_TYPE: ${{ steps.parse.outputs.upgrade_type }}
        run: |
          if [ "$SCOPE" = "all" ]; then
            # Merge all scopes, tagging each entry with its test_scope
            matrix=$(jq -c '
              [.integration[] + {test_scope: "integration"}]
              + [.remediation[] + {test_scope: "remediation"}]
              + [.role[] + {test_scope: "role"}]
            ' .github/test-matrix.json)
          else
            matrix=$(jq -c --arg scope "$SCOPE" \
              '.[$scope] | map(. + {test_scope: $scope})' \
              .github/test-matrix.json)
          fi

          # If a specific upgrade type was requested, filter the matrix
          if [ -n "$UPGRADE_TYPE" ]; then
            matrix=$(echo "$matrix" | jq -c --arg type "$UPGRADE_TYPE" '[.[] | select(.upgrade_type == $type)]')
          fi

          if [ "$matrix" = "[]" ] || [ "$matrix" = "null" ] || [ -z "$matrix" ]; then
            echo "::error::No matching tests for scope '$SCOPE'${UPGRADE_TYPE:+ with upgrade_type '$UPGRADE_TYPE'}"
            exit 1
          fi

          echo "matrix={\"include\":$matrix}" >> $GITHUB_OUTPUT

      - name: Acknowledge command
        run: |
          gh api repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions \
            -f content=eyes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prepare_vars:
    name: Get info from collection and PR to determine if and how to test
    needs: parse_command
    # The concurrency key prevents multiple workflows from running at the same time
    concurrency:
      # Group name contains reponame-pr_num to allow simultaneous runs in different PRs
      group: testing-farm-${{ github.event.repository.name }}-${{ github.event.issue.number }}-${{ needs.parse_command.outputs.test_scope }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    outputs:
      supported_platforms: ${{ steps.supported_platforms.outputs.supported_platforms }}
      head_sha: ${{ steps.head_sha.outputs.head_sha }}
    steps:
      - name: Dump github context
        run:   echo "$GITHUB_CONTEXT"
        shell: bash
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}

      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get head sha of the PR
        id: head_sha
        run: |
          head_sha=$(gh api "repos/$REPO/pulls/$PR_NO" --jq '.head.sha')
          echo "head_sha=$head_sha" >> $GITHUB_OUTPUT
        env:
          REPO: ${{ github.repository }}
          PR_NO: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.head_sha.outputs.head_sha }}
          persist-credentials: false

      - name: Get supported platforms
        id: supported_platforms
        run: |
          supported_platforms=""
          meta_main=meta/main.yml
          # All Fedora are supported, add latest Fedora versions to supported_platforms
          if yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -qi fedora$; then
            supported_platforms+=" Fedora-42"
            supported_platforms+=" Fedora-43"
          fi
          # Specific Fedora versions supported
          if yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -qiP 'fedora\d+$'; then
            for fedora_ver in $(yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -iPo 'fedora\K(\d+$)'); do
              supported_platforms+=" Fedora-$fedora_ver"
            done
          fi
          if yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -qi el7; then
            supported_platforms+=" CentOS-7"
            supported_platforms+=" RHEL-7"
          fi
          if yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -qi el8; then
            supported_platforms+=" CentOS-Stream-8"
            supported_platforms+=" RHEL-8"
          fi
          if yq '.galaxy_info.galaxy_tags[]' "$meta_main" | grep -qi el9; then
            supported_platforms+=" CentOS-Stream-9"
            supported_platforms+=" RHEL-9"
          fi
          echo "supported_platforms=$supported_platforms" >> $GITHUB_OUTPUT

      - name: Print supported platforms
        run: echo "supported_platforms=${{ steps.supported_platforms.outputs.supported_platforms }}"

  testing-farm:
    name: "${{ matrix.test_scope }}${{ matrix.upgrade_type && format('|{0}', matrix.upgrade_type) || '' }}|managed:${{ matrix.managed_node }}|control:${{ matrix.control_node }}|ansible-${{ matrix.ansible_version }}"
    needs:
      - parse_command
      - prepare_vars
    concurrency:
      group: testing-farm-${{ github.event.repository.name }}-${{ github.event.issue.number }}-${{ matrix.test_scope }}-${{ matrix.managed_node }}-${{ matrix.ansible_version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.parse_command.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Set variables with DATETIME and artifact location
        id: set_vars
        run: |
          printf -v DATETIME '%(%Y%m%d-%H%M%S)T' -1
          scope="${{ matrix.test_scope }}"
          upgrade_type="${{ matrix.upgrade_type }}"
          if [ -n "$upgrade_type" ]; then
            scope_label="${scope}-${upgrade_type}"
          else
            scope_label="${scope}"
          fi
          ARTIFACTS_DIR_NAME="tf_${{ github.event.repository.name }}-${{ github.event.issue.number }}_${scope_label}-managed_${{ matrix.managed_node }}-control_${{ matrix.control_node }}-${{ matrix.ansible_version }}_$DATETIME/artifacts"
          echo "DATETIME=$DATETIME" >> $GITHUB_OUTPUT
          if [ -n "$SR_LSR_USER" ]; then
            ARTIFACTS_TARGET_DIR=/srv/pub/alt/${SR_LSR_USER}/logs
            ARTIFACTS_DIR=$ARTIFACTS_TARGET_DIR/$ARTIFACTS_DIR_NAME
            ARTIFACTS_URL=https://dl.fedoraproject.org/pub/alt/${SR_LSR_USER}/logs/$ARTIFACTS_DIR_NAME
            echo "ARTIFACTS_DIR=$ARTIFACTS_DIR" >> $GITHUB_OUTPUT
            echo "ARTIFACTS_URL=$ARTIFACTS_URL" >> $GITHUB_OUTPUT
          fi
        env:
          SR_LSR_USER: ${{ vars.SR_LSR_USER }}

      - name: Check if platform is supported
        id: platform_check
        env:
          PLATFORMS: ${{ needs.prepare_vars.outputs.supported_platforms }}
          MANAGED_NODE: ${{ matrix.managed_node }}
        run: |
          major_ver="${MANAGED_NODE#rhel}"
          is_supported="false"

          if echo "$PLATFORMS" | grep -q "RHEL-${major_ver}"; then
            is_supported="true"
          fi

          echo "is_supported=$is_supported" >> $GITHUB_OUTPUT

      - name: Set commit status as pending
        if: steps.platform_check.outputs.is_supported == 'true'
        uses: myrotvorets/set-commit-status-action@f7319757cba2a18a329dd5f95622ff6b1e8b052d # master
        with:
          sha: ${{ needs.prepare_vars.outputs.head_sha }}
          status: pending
          context: "${{ matrix.test_scope }}${{ matrix.upgrade_type && format('|{0}', matrix.upgrade_type) || '' }}|managed:${{ matrix.managed_node }}|control:${{ matrix.control_node }}|ansible-${{ matrix.ansible_version }}"
          description: Test started
          targetUrl: ""

      - name: Set commit status as success with a description that platform is skipped
        if: steps.platform_check.outputs.is_supported == 'false'
        uses: myrotvorets/set-commit-status-action@f7319757cba2a18a329dd5f95622ff6b1e8b052d # master
        with:
          sha: ${{ needs.prepare_vars.outputs.head_sha }}
          status: success
          context: "${{ matrix.test_scope }}${{ matrix.upgrade_type && format('|{0}', matrix.upgrade_type) || '' }}|managed:${{ matrix.managed_node }}|control:${{ matrix.control_node }}|ansible-${{ matrix.ansible_version }}"
          description: Platform is not supported. Skipping.
          targetUrl: ""

      - name: Check TF_API_KEY_RH
        run: |
          if [ -z "$TF_API_KEY_RH" ]; then
            echo "TF_API_KEY_RH is empty"
          else
            echo "TF_API_KEY_RH is set"
          fi
        env:
          TF_API_KEY_RH: ${{ secrets.TF_API_KEY_RH }}

      - name: Run test in testing farm
        id: testing_farm
        uses: sclorg/testing-farm-as-github-action@230555baceb860aa468d216f1822974836b965d1 # v4.3.1
        if: steps.platform_check.outputs.is_supported == 'true'
        with:
          git_ref: ${{ needs.prepare_vars.outputs.head_sha }}
          tmt_plan_filter: "tag:${{ matrix.test_scope }}_tests"
          pipeline_settings: '{ "type": "tmt-multihost" }'
          environment_settings: '{ "provisioning": { "tags": { "BusinessUnit": "ansible_collection_leapp" } } }'
          # Keeping SR_ARTIFACTS_URL at the bottom makes the link in logs clickable
          variables: "SR_ANSIBLE_VER=${{ matrix.ansible_version }};\
            SR_REPO_NAME=${{ github.event.repository.name }};\
            SR_GITHUB_ORG=${{ github.repository_owner }};\
            SR_PR_NUM=${{ github.event.issue.number }};\
            SR_ARTIFACTS_DIR=${{ steps.set_vars.outputs.ARTIFACTS_DIR }};\
            SR_TEST_LOCAL_CHANGES=true;\
            SR_LSR_USER=${{ vars.SR_LSR_USER }};\
            RHEL_7_9_SERVER_REPO_URL=${{ secrets.RHEL_7_9_SERVER_REPO_URL }};\
            RHEL_7_9_EXTRAS_REPO_URL=${{ secrets.RHEL_7_9_EXTRAS_REPO_URL }};\
            RHEL_8_10_BASEOS_REPO_URL=${{ secrets.RHEL_8_10_BASEOS_REPO_URL }};\
            RHEL_8_10_APPSTREAM_REPO_URL=${{ secrets.RHEL_8_10_APPSTREAM_REPO_URL }};\
            RHEL_9_8_BASEOS_REPO_URL=${{ secrets.RHEL_9_8_BASEOS_REPO_URL }};\
            RHEL_9_8_APPSTREAM_REPO_URL=${{ secrets.RHEL_9_8_APPSTREAM_REPO_URL }};\
            RHEL_10_1_BASEOS_REPO_URL=${{ secrets.RHEL_10_1_BASEOS_REPO_URL }};\
            RHEL_10_1_APPSTREAM_REPO_URL=${{ secrets.RHEL_10_1_APPSTREAM_REPO_URL }};\
            RHEL_9_LATEST_BASEOS_REPO_URL=${{ secrets.RHEL_9_LATEST_BASEOS_REPO_URL }};\
            RHEL_9_LATEST_APPSTREAM_REPO_URL=${{ secrets.RHEL_9_LATEST_APPSTREAM_REPO_URL }};\
            BEAKERLIB_HARNESS_URL_NO_VER=${{ secrets.BEAKERLIB_HARNESS_URL_NO_VER }};\
            SR_ANSIBLE_INJECT_FACT_VARS=false;\
            SR_ARTIFACTS_URL=${{ steps.set_vars.outputs.ARTIFACTS_URL }}"
          tmt_context: "initiator=testing-farm;managed_node=${{ matrix.managed_node }};control_node=${{ matrix.control_node }}${{ matrix.upgrade_type && format(';upgrade_type={0}', matrix.upgrade_type) || '' }}"
          # Note that SR_LSR_SSH_KEY must be single-line, TF doesn't read multi-line variables fine.
          secrets: "SR_LSR_DOMAIN=${{ secrets.SR_LSR_DOMAIN }};\
            SR_LSR_SSH_KEY=${{ secrets.SR_LSR_SSH_KEY }}"
          compose: null
          # There are two blockers for using public ranch:
          # 1. multihost is not supported in public https://github.com/teemtee/tmt/issues/2620
          # 2. Security issue that leaks long secrets - Jira TFT-2698
          tf_scope: private
          api_key: ${{ secrets.TF_API_KEY_RH }}
          update_pull_request_status: false

      - name: Set final commit status
        uses: myrotvorets/set-commit-status-action@f7319757cba2a18a329dd5f95622ff6b1e8b052d # master
        # always() is to run the step even if the previous step failed
        if: always() && steps.platform_check.outputs.is_supported == 'true'
        with:
          sha: ${{ needs.prepare_vars.outputs.head_sha }}
          status: ${{ job.status }}
          context: "${{ matrix.test_scope }}${{ matrix.upgrade_type && format('|{0}', matrix.upgrade_type) || '' }}|managed:${{ matrix.managed_node }}|control:${{ matrix.control_node }}|ansible-${{ matrix.ansible_version }}"
          description: Test finished
          targetUrl: ${{ steps.set_vars.outputs.ARTIFACTS_URL || steps.testing_farm.outputs.test_log_url }}

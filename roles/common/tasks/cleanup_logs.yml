---
# Remove the Leapp log files (*.log, *.json, *.txt) from the Leapp log directory.
#
# Optional variables (tests redirect this to a temporary location):
#   __leapp_reports_dir (optional, default: '/var/log/leapp')
- name: cleanup_logs | Ensure ansible_facts used by role
  ansible.builtin.include_tasks: set_facts.yml
  tags: tests::cleanup

- name: cleanup_logs | Cleanup | Check if the leapp log directory exists
  ansible.builtin.stat:
    path: "{{ __leapp_reports_dir | default('/var/log/leapp') }}"
    follow: true
  register: __leapp_reports_dir_stat
  tags: tests::cleanup

- name: cleanup_logs | Cleanup | Find log files inside leapp log directory
  ansible.builtin.find:
    paths: "{{ __leapp_reports_dir | default('/var/log/leapp') }}"
    patterns:
      - "*.log"
      - "*.json"
      - "*.txt"
  register: __leapp_log_files
  when: __leapp_reports_dir_stat.stat.exists and __leapp_reports_dir_stat.stat.isdir
  tags: tests::cleanup

- name: cleanup_logs | Cleanup | Remove log files
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ __leapp_log_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: __leapp_log_files_removed
  tags: tests::cleanup

# set up the test system to test cifs shares remediation
---
- name: setup | leapp_cifs_detected | Backup /etc/fstab
  ansible.builtin.copy:
    src: /etc/fstab
    dest: /etc/fstab.leapp_test_backup
    remote_src: true
    force: false
    mode: preserve

- name: setup | leapp_cifs_detected | Add a CIFS share to /etc/fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "//127.0.0.1/test_leapp_cifs_detected /mnt/cifs cifs username=test,password=test 0 0"

...
